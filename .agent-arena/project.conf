# Project adapter for Agent Arena.
project_name="agent-arena"
validation_script=".agent-arena/validate.sh"
# approval_mode: human (default) requires a person to approve every
# reviewer APPROVE; auto lets `agent-arena autopilot` approve validated
# checkpoints unattended. auto is a trust-model downgrade: only enable
# it for repositories with strict validation scripts and low risk.
approval_mode="human"
